[pytest]
# 测试目录
testpaths = tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/html/report.html
    --self-contained-html

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(funcName)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 标记定义
markers =
    smoke: 冒烟测试 - 核心功能测试
    regression: 回归测试 - 完整功能测试
    mcp: MCP功能测试
    ai: AI增强测试
    slow: 慢速测试 (执行时间>10秒)
    integration: 集成测试
    performance: 性能测试
    login: 登录相关测试
    chatbot: Chatbot功能测试
    multi_turn: 多轮对话测试

# 超时设置
timeout = 300
timeout_method = thread

# 并行执行配置 (取消注释以启用)
# dist = loadgroup
# numprocesses = auto

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
